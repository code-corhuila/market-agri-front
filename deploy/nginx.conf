server {
    listen 80;
    root /usr/share/nginx/html;

    # The gateway serves the container and the portals in one origin (ADR-017): no CORS.

    # remoteEntry and the federation manifest are never cached: they decide which version of
    # every portal the browser loads (Annex H, rule 4).
    location ~* (remoteEntry\.js|mf-manifest\.json)$ {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
