server {
    listen 80;
    root /usr/share/nginx/html;

    # remoteEntry and the federation manifest are never cached: they decide which version of
    # every portal the browser loads (Annex H, rule 4). The portals, served from other hosts,
    # read them cross-origin, so they carry the CORS header.
    location ~* (remoteEntry\.js|mf-manifest\.json)$ {
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin "*";
    }

    # The modules the shell exposes (shell/apiClient, shell/ui…) are chunks under /assets/ that
    # the portals import cross-origin too. index.html and the rest of the SPA get no CORS header.
    location /assets/ {
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
