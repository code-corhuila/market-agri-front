server {
    listen 80;
    root /usr/share/nginx/html;

    # The gateway serves the container and the portals in one origin (ADR-017): no CORS.

    # remoteEntry and the federation manifest are never cached: they decide which version of
    # every portal the browser loads (Annex H, rule 4).
    location ~* (remoteEntry\.js|mf-manifest\.json)$ {
        add_header Cache-Control "no-store";
    }

    # A file under /assets/ that is not there is a 404, never the application's page: the browser
    # then names the missing chunk instead of failing to run HTML as a script.
    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
